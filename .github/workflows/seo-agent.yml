name: 🤖 SEO Blog Agent

on:
  # Ejecutar automáticamente cada 3 días a las 9:00 AM hora Venezuela (UTC-4 = 13:00 UTC)
  schedule:
    - cron: '0 13 */3 * *'
  # Permitir ejecución manual desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar dependencias Python
        run: pip install requests

      - name: 🤖 Ejecutar Agente SEO
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/seo_agent.py

      - name: 📤 Commit y Push del nuevo artículo
        run: |
          git config user.name "SEO Agent Bot"
          git config user.email "bot@tuesposotrader.com"
          git add src/routes/blog/
          if git diff --cached --quiet; then
            echo "⚠️ No hay cambios para commitear"
            exit 0
          fi
          TITLE=$(git diff --cached --name-only | head -1 | sed 's|src/routes/blog/||' | sed 's|/+page.md||')
          git commit -m "feat(blog): nuevo artículo — $TITLE"
          git push
          echo "✅ Artículo pusheado a GitHub"

      - name: 🏗️ Instalar Node.js y compilar el sitio
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias Node.js
        run: npm ci

      - name: 🔨 Compilar el sitio (SvelteKit build)
        run: npm run build

      - name: ☁️ Desplegar a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler pages deploy build --project-name web-tuesposotrader
          echo "✅ Sitio desplegado en Cloudflare Pages"
          echo "🌐 https://tuesposotrader.com estará actualizado en ~30 segundos"
